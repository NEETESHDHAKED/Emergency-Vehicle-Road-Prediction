<!DOCTYPE html>
<html>
<head>
<title>Nearest Hospital</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
#map { height: 80vh; width: 100%; margin-top: 20px; }
body { font-family: Arial, sans-serif; text-align: center; }
.info { font-size: 18px; margin: 10px; }
</style>
</head>
<body>

<h2>Nearest Hospital: {{ hospital_name }}</h2>
<div class="info">Distance: {{ distance }} km | Travel Time: {{ travel_time }} hours</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
var userLat = parseFloat("{{ user_lat }}");
var userLon = parseFloat("{{ user_lon }}");
var hospLat = parseFloat("{{ hosp_lat }}");
var hospLon = parseFloat("{{ hosp_lon }}");

var map = L.map('map').setView([userLat,userLon], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom: 19
}).addTo(map);

var userMarker = L.marker([userLat,userLon]).addTo(map).bindPopup("You are here").openPopup();
var hospMarker = L.marker([hospLat,hospLon]).addTo(map).bindPopup("Hospital: {{ hospital_name }}");

async function drawRoadRoute() {
    const url =
        `https://router.project-osrm.org/route/v1/driving/` +
        `${userLon},${userLat};${hospLon},${hospLat}` +
        `?overview=full&geometries=geojson`;

    try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.code !== "Ok" || !data.routes.length) {
            throw new Error("Route not found");
        }

        const bestRoute = data.routes[0];

        const roadCoordinates =
            bestRoute.geometry.coordinates.map(([lon, lat]) => [lat, lon]);

        L.polyline(roadCoordinates, {
            color: "blue",
            weight: 6
        }).addTo(map);

        map.fitBounds(L.latLngBounds(roadCoordinates), {
            padding: [30, 30]
        });

        console.log("Road distance:", (bestRoute.distance / 1000).toFixed(2), "km");
        console.log("Estimated route time:", Math.round(bestRoute.duration / 60), "minutes");

    } catch (error) {
        console.error(error);
        alert("Road route load nahi hua. Dobara try karo.");
    }
}

drawRoadRoute();
</script>

</body>
</html>
